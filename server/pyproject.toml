[project]
name = "backchannel-server"
version = "1.0.0"
description = "Asynchronous multi-agent spectator group chat backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "email-validator==2.3.0",
    "fastapi==0.141.1",
    "google-genai==2.22.0",
    "groq==1.7.0",
    "httpx==0.28.1",
    "pwdlib[argon2]==0.3.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.14.0",
    "python-dotenv==1.2.3",
    "redis==8.1.0",
    "uvicorn==0.52.4",
    "websockets==16.1.1",
]

[tool.uv]
package = false
